name: Publish release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate tag and package version
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const tag = process.env.TAG
          const version = require('./packages/tarot/package.json').version
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) {
            throw new Error(`release tag is not a supported version: ${tag}`)
          }
          if (tag !== `v${version}`) {
            throw new Error(`tag ${tag} does not match package version ${version}`)
          }
          require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`)
          NODE
      - name: Check generated data
        run: pnpm data:check && node scripts/check-methods.mjs
      - name: Type-check
        run: NODE_OPTIONS=--max-old-space-size=12288 pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build plugin
        run: pnpm --filter dsh-rws-tarot build
      - name: Check whether the version is already published
        id: registry
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "dsh-rws-tarot@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "dsh-rws-tarot@$VERSION is already published; skipping npm publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.registry.outputs.publish == 'true'
        working-directory: packages/tarot
        run: npm publish --access public

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Release V${TAG#v}" --notes ""
