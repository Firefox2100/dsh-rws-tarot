name: Publish release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or recover
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate tag and package version
        id: package
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node <<'NODE'
          const tag = process.env.TAG
          const version = require('./packages/tarot/package.json').version
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) {
            throw new Error(`release tag is not a supported version: ${tag}`)
          }
          if (tag !== `v${version}`) {
            throw new Error(`tag ${tag} does not match package version ${version}`)
          }
          require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`)
          NODE
      - name: Check generated data
        run: pnpm data:check && node scripts/check-methods.mjs
      - name: Type-check
        run: NODE_OPTIONS=--max-old-space-size=12288 pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build plugin
        run: pnpm --filter dsh-rws-tarot build
      - name: Check whether the version is already published
        id: registry
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if npm view "dsh-rws-tarot@$VERSION" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "dsh-rws-tarot@$VERSION is already published; skipping npm publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.registry.outputs.publish == 'true'
        working-directory: packages/tarot
        run: npm publish --access public

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to create."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Release V${TAG#v}" --notes ""
          fi
